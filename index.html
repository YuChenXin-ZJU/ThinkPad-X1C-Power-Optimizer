<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThinkPad X1 电源优化</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="page">
      <header class="masthead">
        <div class="brand">ThinkPad</div>
        <div class="lang">
          <button class="lang-btn" id="lang-zh" type="button">中文</button>
          <button class="lang-btn" id="lang-en" type="button">English</button>
          <button class="lang-btn" id="lang-ja" type="button">日本語</button>
        </div>
      </header>

      <article class="article">
        <h1 id="title">ThinkPad X1 Carbon 2024 电源计划工具</h1>
        <p id="subtitle" class="subtitle"></p>
        <div id="admin-banner" class="hidden"></div>

        <section class="section">
          <h2 id="sec-actions-title" class="section-title">操作</h2>
          <div class="actions">
            <button id="btn-list" type="button" class="action">
              <div class="action-title" id="btn-list-title">查看电源计划</div>
              <div class="action-desc" id="btn-list-desc">列出所有计划并标记当前活动方案。</div>
            </button>
            <button id="btn-backup" type="button" class="action">
              <div class="action-title" id="btn-backup-title">备份电源计划</div>
              <div class="action-desc" id="btn-backup-desc">导出 .pow 文件到桌面，便于恢复。</div>
            </button>
            <button id="btn-optimize" type="button" class="action primary">
              <div class="action-title" id="btn-optimize-title">同步插电=电池（推荐）</div>
              <div class="action-desc" id="btn-optimize-desc">将当前计划的 AC 值对齐 DC 值。</div>
            </button>
            <button id="btn-optimize-its" type="button" class="action">
              <div class="action-title" id="btn-optimize-its-title">同步 + 禁用 Lenovo ITS</div>
              <div class="action-desc" id="btn-optimize-its-desc">在同步基础上禁用 ITS 服务。</div>
            </button>
            <button id="btn-autotask-install" type="button" class="action primary">
              <div class="action-title" id="btn-autotask-install-title">安装自动回写任务</div>
              <div class="action-desc" id="btn-autotask-install-desc">登录/唤醒/电源切换后自动重写 AC=DC。</div>
            </button>
            <button id="btn-autotask-remove" type="button" class="action">
              <div class="action-title" id="btn-autotask-remove-title">移除自动回写任务</div>
              <div class="action-desc" id="btn-autotask-remove-desc">删除本工具创建的计划任务。</div>
            </button>
            <button id="btn-reset" type="button" class="action danger wide">
              <div class="action-title" id="btn-reset-title">恢复默认电源计划</div>
              <div class="action-desc" id="btn-reset-desc">还原 Windows 默认方案并尝试恢复 ITS。</div>
            </button>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2 id="sec-output-title" class="section-title">输出</h2>
            <button id="btn-clear" type="button" class="btn-ghost">清空</button>
          </div>
          <div id="output" class="output"></div>
        </section>
      </article>

      <div id="disclaimer" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
          <div class="modal-title" id="disclaimer-title">免责声明</div>
          <div class="modal-body" id="disclaimer-body"></div>
          <div class="modal-actions">
            <button id="disclaimer-exit" type="button" class="btn-ghost">退出</button>
            <button id="disclaimer-accept" type="button" class="btn-primary">
              我已了解并继续
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
